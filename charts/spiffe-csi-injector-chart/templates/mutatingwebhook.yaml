apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: csi-injector-webhook.omegahome.net
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/csi-injector-tls
    {{- if .Values.webhookWait.enabled }}
    # Deferred to a post-install/post-upgrade hook, applied only after the
    # webhookWait Job (lower hook-weight) confirms the backing pod is Ready.
    # This closes the race where the webhook could start intercepting
    # admission requests before anything is listening behind the Service.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- end }}
  labels:
    {{- include "spiffe-csi-injector.labels" . | nindent 4 }}
webhooks:
  - name: csi-injector.{{ .Release.Namespace }}.svc.cluster.local
    clientConfig:
      service:
        name: {{ .Values.service.name }}
        namespace: {{ .Release.Namespace }}
        path: /mutate
        port: {{ .Values.webhook.port }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: "*"
    namespaceSelector:
      {{- toYaml .Values.webhook.namespaceSelector | nindent 6 }}
    reinvocationPolicy: IfNeeded
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    failurePolicy: {{ .Values.webhook.failurePolicy }}
